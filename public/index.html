<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Fantasy News Bot</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #16181d; --muted: #6b7280; --line: #e5e7eb;
    --accent: #2563eb; --accent-text: #ffffff; --ok: #15803d; --warn: #b45309; --bad: #b91c1c; --chip: #eef2ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #181b21; --text: #e8eaee; --muted: #9aa1ad; --line: #2a2f38;
      --accent: #3b82f6; --accent-text: #ffffff; --ok: #4ade80; --warn: #fbbf24; --bad: #f87171; --chip: #1f2a44;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 16px 16px 80px; }
  h1 { font-size: 20px; margin: 4px 0 2px; }
  h2 { font-size: 15px; margin: 0 0 10px; color: var(--muted); font-weight: 600; }
  .sub { color: var(--muted); font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-top: 14px; }
  .row { display: flex; gap: 8px; }
  input, select, button { font: inherit; color: inherit; }
  input, select { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
  select { width: auto; min-width: 104px; }
  button { cursor: pointer; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 12px; white-space: nowrap; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--chip); border-radius: 999px; padding: 4px 4px 4px 10px; font-size: 14px; }
  .chip small { color: var(--muted); }
  .chip button { border: 0; background: transparent; padding: 2px 8px; border-radius: 999px; font-size: 16px; line-height: 1; color: var(--muted); }
  .chip button:hover { color: var(--bad); }
  .list { margin-top: 10px; }
  .pl { display: flex; align-items: center; gap: 10px; padding: 8px 2px; border-top: 1px solid var(--line); }
  .pl:first-child { border-top: 0; }
  .pl img, .pl .ph { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: var(--line); flex: none; }
  .pl .info { flex: 1; min-width: 0; }
  .pl .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pl .meta { color: var(--muted); font-size: 13px; }
  .inj { color: var(--warn); font-weight: 600; }
  .pl button.on { color: var(--ok); border-color: var(--ok); }
  .status { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); background: var(--card); border: 1px solid var(--line);
            border-radius: 999px; padding: 6px 14px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,.12); display: none; }
  .status.show { display: block; }
  .status.err { color: var(--bad); }
  .hint { color: var(--muted); font-size: 14px; padding: 8px 2px; }
  .lock { text-align: center; padding: 40px 10px; }
  .lock code { background: var(--chip); padding: 2px 6px; border-radius: 6px; }
  @media (max-width: 420px) { .row.wrap { flex-wrap: wrap; } .row.wrap select { width: 100%; } }
</style>
</head>
<body>
<main>
  <h1>🏀 Миний тоглогчид</h1>
  <div class="sub" id="sub">Шинэ мэдээ гарахад Telegram-аар мэдэгдэнэ.</div>

  <section id="locked" class="card lock" hidden>
    <p><b>Нэвтрэх линк хэрэгтэй.</b></p>
    <p>Telegram дээр bot-доо <code>/web</code> гэж бичээд ирсэн линкээр нээнэ үү.</p>
  </section>

  <div id="app" hidden>
    <section class="card">
      <h2 id="mineTitle">Сонгосон тоглогчид</h2>
      <div class="chips" id="mine"></div>
    </section>

    <section class="card">
      <h2>Тоглогч нэмэх</h2>
      <div class="row wrap">
        <input id="q" type="search" placeholder="Нэрээр хайх… (жишээ: jokic)" autocomplete="off">
        <select id="team"><option value="">Бүх баг</option></select>
      </div>
      <div class="list" id="results"></div>
    </section>

    <section class="card">
      <h2>Жагсаалтад байхгүй тоглогч</h2>
      <div class="row">
        <input id="custom" placeholder="Нэр (хоч) — жишээ: Shai Gilgeous-Alexander (SGA)">
        <button class="primary" id="addCustom">Нэмэх</button>
      </div>
      <div class="sub" id="rosterInfo" style="margin-top:8px"></div>
    </section>
  </div>
</main>
<div class="status" id="status"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const norm = (s) => (s || "").normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase()
    .replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();
  const key = (n) => norm(n).replace(/ (jr|sr|ii|iii|iv)$/, "");

  // ---- secret key: from ?key= once, then remembered on this device
  let k = new URLSearchParams(location.search).get("key");
  try {
    if (k) localStorage.setItem("fnbKey", k); else k = localStorage.getItem("fnbKey");
  } catch (e) { /* storage blocked: key only lives in the URL */ }
  if (new URLSearchParams(location.search).has("key")) history.replaceState(null, "", location.pathname);

  let roster = [], mine = [], saveTimer = null;

  const api = async (path, opts = {}) => {
    const res = await fetch(path, { ...opts, headers: { "x-key": k || "", "Content-Type": "application/json", ...(opts.headers || {}) } });
    if (res.status === 401) { lock(); throw new Error("unauthorized"); }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || res.status);
    return data;
  };

  function lock() {
    try { localStorage.removeItem("fnbKey"); } catch (e) {}
    $("app").hidden = true; $("locked").hidden = false;
  }

  function flash(text, err) {
    const s = $("status");
    s.textContent = text; s.className = "status show" + (err ? " err" : "");
    clearTimeout(flash.t);
    if (!err) flash.t = setTimeout(() => (s.className = "status"), 1800);
  }

  const isMine = (p) => mine.some((m) => (p.id && m.espnId === p.id) || key(m.name) === key(p.name));

  function save() {
    clearTimeout(saveTimer);
    flash("Хадгалж байна…");
    saveTimer = setTimeout(async () => {
      try {
        mine = await api("/api/players", { method: "PUT", body: JSON.stringify({ players: mine }) });
        flash("Хадгалсан ✓");
        renderMine(); renderResults();
      } catch (e) { if (e.message !== "unauthorized") flash("Хадгалж чадсангүй: " + e.message, true); }
    }, 350);
  }

  function toggle(p) {
    if (isMine(p)) mine = mine.filter((m) => !((p.id && m.espnId === p.id) || key(m.name) === key(p.name)));
    else mine.push({ name: p.name, aliases: [], espnId: p.id || undefined, team: p.team || undefined });
    renderMine(); renderResults(); save();
  }

  function el(tag, attrs = {}, ...kids) {
    const e = document.createElement(tag);
    for (const [a, v] of Object.entries(attrs)) {
      if (a === "class") e.className = v; else if (a.startsWith("on")) e.addEventListener(a.slice(2), v); else e.setAttribute(a, v);
    }
    for (const c of kids) if (c != null) e.append(c);
    return e;
  }

  function renderMine() {
    const box = $("mine"); box.replaceChildren();
    $("mineTitle").textContent = `Сонгосон тоглогчид (${mine.length})`;
    if (!mine.length) { box.append(el("div", { class: "hint" }, "Одоогоор алга. Доороос хайж нэмнэ үү.")); return; }
    for (const m of [...mine].sort((a, b) => a.name.localeCompare(b.name))) {
      const label = m.aliases?.length ? ` (${m.aliases.join("/")})` : "";
      box.append(el("span", { class: "chip" },
        m.name + label, m.team ? el("small", {}, m.team) : null,
        el("button", { title: "Хасах", "aria-label": "Хасах " + m.name, onclick: () => {
          mine = mine.filter((x) => x !== m); renderMine(); renderResults(); save();
        } }, "×")));
    }
  }

  function renderResults() {
    const box = $("results"); box.replaceChildren();
    const q = norm($("q").value), team = $("team").value;
    if (!roster.length) { box.append(el("div", { class: "hint" }, "Тоглогчдын жагсаалт ачаалж байна…")); return; }
    if (q.length < 2 && !team) { box.append(el("div", { class: "hint" }, "Нэрээр хайх эсвэл баг сонгоно уу.")); return; }
    const words = q.split(" ").filter(Boolean);
    const hits = roster.filter((p) => (!team || p.team === team) && words.every((w) => norm(p.name).includes(w))).slice(0, 60);
    if (!hits.length) { box.append(el("div", { class: "hint" }, "Олдсонгүй. Доорх “Жагсаалтад байхгүй” хэсгээс гараар нэмж болно.")); return; }
    for (const p of hits) {
      const on = isMine(p);
      const img = p.headshot ? el("img", { src: p.headshot, alt: "", loading: "lazy" }) : el("div", { class: "ph" });
      if (p.headshot) img.addEventListener("error", () => img.replaceWith(el("div", { class: "ph" })));
      box.append(el("div", { class: "pl" }, img,
        el("div", { class: "info" },
          el("div", { class: "name" }, p.name),
          el("div", { class: "meta" }, [p.team, p.pos].filter(Boolean).join(" · "),
            p.injury ? el("span", { class: "inj" }, " · " + p.injury) : null)),
        el("button", { class: on ? "on" : "primary", onclick: () => toggle(p) }, on ? "✓ Хасах" : "Нэмэх")));
    }
  }

  $("q").addEventListener("input", renderResults);
  $("team").addEventListener("change", renderResults);
  const addCustom = () => {
    const raw = $("custom").value.trim();
    const m = raw.match(/^(.*?)\s*(?:\((.*)\))?$/);
    const name = (m && m[1] || "").trim();
    if (!name) return;
    if (mine.some((x) => key(x.name) === key(name))) { flash("Аль хэдийн нэмсэн"); return; }
    const aliases = (m[2] || "").split(/[\/|,]/).map((a) => a.trim()).filter(Boolean);
    const found = roster.find((p) => key(p.name) === key(name));
    mine.push({ name: found ? found.name : name, aliases, espnId: found?.id, team: found?.team });
    $("custom").value = ""; renderMine(); renderResults(); save();
  };
  $("addCustom").addEventListener("click", addCustom);
  $("custom").addEventListener("keydown", (e) => { if (e.key === "Enter") addCustom(); });

  async function start() {
    if (!k) { lock(); return; }
    $("app").hidden = false;
    renderResults();
    try {
      mine = await api("/api/players");
      renderMine();
    } catch (e) { if (e.message !== "unauthorized") flash("Ачаалж чадсангүй: " + e.message, true); return; }
    try {
      const r = await api("/api/roster");
      roster = r.players || [];
      for (const t of r.teams || []) $("team").append(el("option", { value: t.abbr }, t.abbr + (t.name ? " — " + t.name : "")));
      $("rosterInfo").textContent = `NBA-ийн ${roster.length} тоглогч · шинэчилсэн: ${new Date(r.updatedAt).toLocaleString()}`;
    } catch (e) {
      $("rosterInfo").textContent = "Тоглогчдын жагсаалт ачаалагдсангүй (" + e.message + "). Гараар нэмж болно.";
    }
    renderResults();
  }
  start();
})();
</script>
</body>
</html>
