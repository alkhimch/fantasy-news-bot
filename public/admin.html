<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Fantasy News Admin</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #16181d; --muted: #6b7280; --line: #e5e7eb;
    --accent: #2563eb; --accent-text: #ffffff; --ok: #15803d; --warn: #b45309; --bad: #b91c1c; --chip: #eef2ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #181b21; --text: #e8eaee; --muted: #9aa1ad; --line: #2a2f38;
      --accent: #3b82f6; --accent-text: #ffffff; --ok: #4ade80; --warn: #fbbf24; --bad: #f87171; --chip: #1f2a44;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 16px 16px 80px; }
  h1 { font-size: 20px; margin: 4px 0 2px; }
  .sub { color: var(--muted); font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-top: 14px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  input, select, button { font: inherit; color: inherit; }
  input, select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
  button { cursor: pointer; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 12px; white-space: nowrap; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.danger { color: var(--bad); }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .tabs button.on { background: var(--chip); border-color: var(--accent); }
  .user .head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .user .name { font-weight: 600; }
  .user .meta { color: var(--muted); font-size: 13px; }
  .user .meta a { color: inherit; }
  .badge { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 10px; background: var(--chip); flex: none; }
  .badge.active { color: var(--ok); } .badge.pending { color: var(--warn); }
  .badge.expired, .badge.blocked { color: var(--bad); }
  .user .note { width: 100%; margin-top: 10px; }
  .user .actions { margin-top: 10px; }
  .hint { color: var(--muted); font-size: 14px; padding: 8px 2px; }
  .lock { text-align: center; padding: 40px 10px; }
  .lock code { background: var(--chip); padding: 2px 6px; border-radius: 6px; }
  .status { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); background: var(--card); border: 1px solid var(--line);
            border-radius: 999px; padding: 6px 14px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,.12); display: none; }
  .status.show { display: block; }
  .status.err { color: var(--bad); }
  @media (max-width: 420px) { .row select, .row input[type=date] { width: 100%; } }
</style>
</head>
<body>
<main>
  <h1>👥 Хэрэглэгчид</h1>
  <div class="sub" id="summary">Ачаалж байна…</div>

  <section id="locked" class="card lock" hidden>
    <p><b>Админ линк хэрэгтэй.</b></p>
    <p>Telegram дээр bot-доо <code>/admin</code> гэж бичээд ирсэн линкээр нээнэ үү.</p>
  </section>

  <div id="app" hidden>
    <div class="tabs" id="tabs"></div>
    <div id="list"></div>
  </div>
</main>
<div class="status" id="status"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);

  let k = new URLSearchParams(location.search).get("key");
  try {
    if (k) localStorage.setItem("fnbAdminKey", k); else k = localStorage.getItem("fnbAdminKey");
  } catch (e) { /* storage blocked: key only lives in the URL */ }
  if (new URLSearchParams(location.search).has("key")) history.replaceState(null, "", location.pathname);

  let users = [], filter = "pending";
  const LABEL = { pending: "Хүлээгдэж буй", active: "Идэвхтэй", expired: "Дууссан", blocked: "Хаасан" };

  const api = async (path, opts = {}) => {
    const res = await fetch(path, { ...opts, headers: { "x-key": k || "", "Content-Type": "application/json" } });
    if (res.status === 401) { lock(); throw new Error("unauthorized"); }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || res.status);
    return data;
  };

  function lock() {
    try { localStorage.removeItem("fnbAdminKey"); } catch (e) {}
    $("app").hidden = true; $("locked").hidden = false; $("summary").textContent = "";
  }

  function flash(text, err) {
    const s = $("status");
    s.textContent = text; s.className = "status show" + (err ? " err" : "");
    clearTimeout(flash.t);
    if (!err) flash.t = setTimeout(() => (s.className = "status"), 1800);
  }

  function el(tag, attrs = {}, ...kids) {
    const e = document.createElement(tag);
    for (const [a, v] of Object.entries(attrs)) {
      if (a === "class") e.className = v; else if (a.startsWith("on")) e.addEventListener(a.slice(2), v); else e.setAttribute(a, v);
    }
    for (const c of kids) if (c != null) e.append(c);
    return e;
  }

  // dates are shown in Ulaanbaatar time, like the bot's messages
  const day = (iso) => (iso ? new Date(Date.parse(iso) + 8 * 3600e3).toISOString().slice(0, 10) : "");
  const plusDays = (n) => day(new Date(Date.now() + n * 864e5).toISOString());
  const seasonEnd = () => { const d = new Date(); return `${d.getMonth() >= 6 ? d.getFullYear() + 1 : d.getFullYear()}-06-30`; };

  async function update(u, body, done) {
    flash("Хадгалж байна…");
    try {
      const nu = await api(`/api/admin/users/${u.chatId}`, { method: "PUT", body: JSON.stringify(body) });
      Object.assign(u, nu, { active: nu.status === "active" && (!nu.expiresAt || Date.parse(nu.expiresAt) > Date.now()) });
      flash(done || "Хадгалсан ✓");
      render();
    } catch (e) { if (e.message !== "unauthorized") flash("Алдаа: " + e.message, true); }
  }

  function openControls(u) {
    const sel = el("select", { "aria-label": "Хугацаа" },
      el("option", { value: "season" }, `Улирлын төгсгөл (${seasonEnd()})`),
      el("option", { value: "30" }, "30 хоног"),
      el("option", { value: "90" }, "90 хоног"),
      el("option", { value: "none" }, "Хугацаагүй"),
      el("option", { value: "date" }, "Өөр огноо…"));
    const date = el("input", { type: "date", "aria-label": "Дуусах огноо", hidden: "" });
    sel.addEventListener("change", () => { date.hidden = sel.value !== "date"; });
    const expiry = () => ({ season: seasonEnd(), "30": plusDays(30), "90": plusDays(90), none: "", date: date.value })[sel.value];
    const label = u.active ? "Сунгах" : "Эрх нээх";
    const go = el("button", { class: "primary", onclick: () => {
      const exp = expiry();
      if (sel.value === "date" && !exp) { flash("Огноо сонгоно уу", true); return; }
      update(u, { status: "active", expiresAt: exp }, u.active ? "Сунгасан ✓" : "Эрх нээгдлээ ✓ Хэрэглэгчид мэдэгдсэн");
    } }, label);
    return [sel, date, go];
  }

  function card(u) {
    const handle = u.username ? el("a", { href: "https://t.me/" + u.username, target: "_blank", rel: "noopener" }, "@" + u.username) : null;
    const status = u.status === "active" && !u.active ? "expired" : u.status;
    const dates = [
      u.requestedAt && "Хүсэлт: " + day(u.requestedAt),
      u.activatedAt && "Нээсэн: " + day(u.activatedAt),
      u.status === "active" ? (u.expiresAt ? "Дуусах: " + day(u.expiresAt) : "Хугацаагүй") : null,
      u.status === "expired" && u.expiresAt ? "Дууссан: " + day(u.expiresAt) : null,
      `${u.players} тоглогч`,
    ].filter(Boolean).join(" · ");
    const note = el("input", { class: "note", placeholder: "Тэмдэглэл (жишээ: 11/09 Хаан банкаар төлсөн)", value: u.note || "" });
    note.addEventListener("change", () => update(u, { note: note.value }));
    const actions = el("div", { class: "row actions" });
    if (u.status !== "blocked") actions.append(...openControls(u));
    if (u.status === "blocked") actions.append(el("button", { class: "primary", onclick: () => update(u, { status: "pending" }) }, "Хаалтыг болих"));
    else actions.append(el("button", { class: "danger", onclick: () => {
      if (confirm(`${u.name || u.chatId}-ийн эрхийг хаах уу?`)) update(u, { status: "blocked" }, "Хаасан");
    } }, "Хаах"));
    return el("section", { class: "card user" },
      el("div", { class: "head" },
        el("div", {},
          el("div", { class: "name" }, u.name || "(нэргүй)"),
          el("div", { class: "meta" }, handle, handle ? " · " : "", "ID: " + u.chatId)),
        el("span", { class: "badge " + status }, LABEL[status] || status)),
      el("div", { class: "meta", style: "margin-top:6px" }, dates),
      note, actions);
  }

  function render() {
    const statusOf = (u) => (u.status === "active" && !u.active ? "expired" : u.status);
    const count = (s) => users.filter((u) => statusOf(u) === s).length;
    $("summary").textContent = `Идэвхтэй: ${count("active")} · Хүлээгдэж буй: ${count("pending")} · Нийт: ${users.length}`;
    const tabs = $("tabs"); tabs.replaceChildren();
    for (const s of ["pending", "active", "expired", "blocked", "all"]) {
      const n = s === "all" ? users.length : count(s);
      tabs.append(el("button", { class: s === filter ? "on" : "", onclick: () => { filter = s; render(); } },
        `${s === "all" ? "Бүгд" : LABEL[s]} (${n})`));
    }
    const list = $("list"); list.replaceChildren();
    const shown = users.filter((u) => filter === "all" || statusOf(u) === filter);
    if (!shown.length) {
      list.append(el("div", { class: "card hint" }, users.length ? "Энд хэрэглэгч алга."
        : "Одоогоор хэрэглэгч алга. Хүн bot руу бичихэд энд гарч ирнэ, танд Telegram-аар мэдэгдэнэ."));
    }
    for (const u of shown) list.append(card(u));
  }

  async function start() {
    if (!k) { lock(); return; }
    try { users = await api("/api/admin/users"); }
    catch (e) { if (e.message !== "unauthorized") $("summary").textContent = "Ачаалж чадсангүй: " + e.message; return; }
    if (!users.some((u) => u.status === "pending")) filter = "all";
    $("app").hidden = false;
    render();
  }
  start();
})();
</script>
</body>
</html>
